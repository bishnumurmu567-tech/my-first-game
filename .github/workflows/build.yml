name: Build Android APK

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    container: kivy/buildozer:latest

    steps:
    - uses: actions/checkout@v4

    - name: Fix ownership and Build APK
      run: |
        git config --global --add safe.directory /__w/my-first-game/my-first-game
        buildozer -v --allow-root android debug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: game-apk
        path: bin/*.apk
